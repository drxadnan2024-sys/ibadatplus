name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Prepare Gradle Wrapper
        run: |
          # If repository root contains IbadatPlus subfolder, navigate into it
          if [ -d "IbadatPlus" ] && [ -f "IbadatPlus/settings.gradle.kts" ]; then
            cd IbadatPlus
          fi
          # Ensure gradlew exists and has executable permissions
          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper files..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          if [ -d "IbadatPlus" ] && [ -f "IbadatPlus/settings.gradle.kts" ]; then
            cd IbadatPlus
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IbadatPlus-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
